<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f7f6; text-align: center; }
    .container { padding: 80px 20px; }
    h1 { font-size: 72px; color: #e74c3c; margin-bottom: 10px; }
    a { display: inline-block; padding: 10px 20px; background: #2c3e50; color: white; text-decoration: none; border-radius: 4px; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <h2>Oops! Page Not Found</h2>
    <p>The requested route does not exist on this server.</p>
    <a href="/home">Back to Home</a>
  </div>
</body>
</html>
